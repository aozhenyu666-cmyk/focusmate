name: Android

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Unit tests, lint, debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          t = f = e = 0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              s = open(p, encoding='utf-8').read()
              m = re.search(r'tests="(\d+)".*?failures="(\d+)".*?errors="(\d+)"', s, re.S)
              if m: t += int(m[1]); f += int(m[2]); e += int(m[3])
          print(f"Unit tests: {t} run, {f} failures, {e} errors")
          PY
          grep -E "^[0-9]+ errors?, [0-9]+ warnings?" app/build/reports/lint-results-debug.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          grep -B1 -A3 ': Error:' app/build/reports/lint-results-debug.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: warn

      # 每个分支一个预览链接，互不覆盖；拉取请求不发布。
      - name: Publish preview APK
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          SLUG=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          TAG="preview-${SLUG}"
          cp app/build/outputs/apk/debug/app-debug.apk focusmate.apk
          SHA=$(sha256sum focusmate.apk | cut -d' ' -f1)
          NOTES="FocusMate ${VERSION}（versionCode ${CODE}）预览包，未经真机验收。
          分支：${GITHUB_REF_NAME}
          提交：${GITHUB_SHA}
          SHA-256：${SHA}
          固定测试签名，之后的预览包可以直接覆盖安装。"
          gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "$TAG" focusmate.apk --prerelease --target "$GITHUB_SHA" \
            --title "FocusMate ${VERSION} 预览（${GITHUB_REF_NAME}）" --notes "$NOTES"
          echo "APK: https://github.com/${GH_REPO}/releases/download/${TAG}/focusmate.apk" >> "$GITHUB_STEP_SUMMARY"
